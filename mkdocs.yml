site_name: TOTK Decompilation Guide
site_description: Beginner-friendly documentation for the TOTK matching decompilation project
site_url: https://oxodx.github.io/totk-decomp/
repo_url: https://github.com/oxodx/totk-decomp
repo_name: totk-decomp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: build/docs

theme:
  name: material
  logo: assets/triforce.svg
  favicon: assets/triforce.svg
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oxodx/totk-decomp
      name: TOTK decompilation on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - About: index.md
  - Get started: getting-started.md
  - Contribute: contributing.md
  - Build & test: build-and-test.md
  - Project layout: project-layout.md
